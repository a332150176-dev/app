name: Build Android APK and update fixed Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Set increasing Android version code
        run: |
          sed -i -E "s/^([[:space:]]*versionCode[[:space:]]+)[0-9]+/\\1${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          grep -n 'versionCode' android/app/build.gradle
      - name: Enable exact reminder alarm
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          perm = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if 'android.permission.SCHEDULE_EXACT_ALARM' not in s:
              s = s.replace('<application', perm + '\n    <application', 1)
          p.write_text(s, encoding='utf-8')
          PY
      # Use one fixed signing key so the APK signature remains stable between CI runners.
      # This is a development/debug signing key for this project, not a production app-store key.
      - name: Configure stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode signing/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Force the stable signing key for debug APK
        run: |
          cat >> android/app/build.gradle <<'EOF'

          // Use the same committed key for every debug APK, not a runner-generated key.
          android {
            signingConfigs {
              stableDebug {
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
              }
            }
            buildTypes {
              debug {
                signingConfig signingConfigs.stableDebug
              }
            }
          }
          EOF
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'Alias name:|SHA256:'
      - name: Compile debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Verify APK signature matches the committed key
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIGNATURE_OUTPUT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE_OUTPUT"
          EXPECTED="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$(printf '%s\n' "$SIGNATURE_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          echo "Expected committed-key SHA256: $EXPECTED"
          echo "APK signer SHA256: $ACTUAL"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"
      - name: Keep Actions artifact as fallback
        uses: actions/upload-artifact@v4
        with:
          name: kav-leyeshiva-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish or update the fixed GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-apk
          target_commitish: main
          name: קו לישיבה — הורדה ישירה
          body: |
            הורדה ישירה של קובץ ה-APK העדכני של פרויקט קו לישיבה.
            
            הקובץ מתעדכן אוטומטית לאחר כל בנייה מוצלחת. הורידו את app-debug.apk תחת Assets.
            
            זוהי גרסת Debug להתקנה ידנית, חתומה במפתח פיתוח קבוע עבור הפרויקט.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
