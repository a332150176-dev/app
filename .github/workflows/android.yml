name: Build Android APK and update fixed Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Enable exact reminder alarm
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          perm = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if 'android.permission.SCHEDULE_EXACT_ALARM' not in s:
              s = s.replace('<application', perm + '\n    <application', 1)
          p.write_text(s, encoding='utf-8')
          PY
      # Use one fixed signing key so the APK signature remains stable between CI runners.
      # This is a development/debug signing key for this project, not a production app-store key.
      - name: Configure stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode signing/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Compile debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
      - name: Keep Actions artifact as fallback
        uses: actions/upload-artifact@v4
        with:
          name: kav-leyeshiva-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish or update the fixed GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-apk
          target_commitish: main
          name: קו לישיבה — הורדה ישירה
          body: |
            הורדה ישירה של קובץ ה-APK העדכני של פרויקט קו לישיבה.
            
            הקובץ מתעדכן אוטומטית לאחר כל בנייה מוצלחת. הורידו את app-debug.apk תחת Assets.
            
            זוהי גרסת Debug להתקנה ידנית, חתומה במפתח פיתוח קבוע עבור הפרויקט.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
